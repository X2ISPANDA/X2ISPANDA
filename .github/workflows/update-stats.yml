name: Update README cards

on:
  schedule:
    # 每天 UTC 03:00（北京时间 11:00）自动更新一次统计卡片
    - cron: "0 3 * * *"
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # 生成 GitHub 统计卡片（含私有仓库贡献）
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          # count_private=true 依赖 PAT 的 repo 权限（已配置为仓库 Secret PAT_STATS）
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&theme=react&line_height=40
          path: profile/stats.svg
          token: ${{ secrets.PAT_STATS }}

      # 生成常用语言卡片
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=react&line_height=40&hide=css
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_STATS }}

      # 生成项目 pin 卡片（lrcshare-v3）
      - name: Generate repo pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=lrcshare-v3&show_owner=true
          path: profile/pin-lrcshare-v3.svg
          token: ${{ secrets.PAT_STATS }}

      # 提交生成的 SVG 文件到仓库
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg || true
          git commit -m "Update README cards" || exit 0
          git push
