<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" fill="none">
  <!-- 背景 -->
  <rect width="320" height="180" rx="10" fill="#0d1117"/>

  <!-- 窗口标题栏 -->
  <rect x="0" y="0" width="320" height="26" rx="10" fill="#161b22"/>
  <circle cx="14" cy="13" r="4.5" fill="#ff5f56"/>
  <circle cx="30" cy="13" r="4.5" fill="#ffbd2e"/>
  <circle cx="46" cy="13" r="4.5" fill="#27c93f"/>
  <text x="160" y="17" text-anchor="middle" fill="#8b949e" font-size="11" font-family="Consolas, Monaco, monospace">lrcshare.ts</text>

  <!-- 代码行 -->
  <text x="16" y="52" fill="#7ee787" font-size="12" font-family="Consolas, Monaco, monospace">const</text>
  <text x="56" y="52" fill="#79c0ff" font-size="12" font-family="Consolas, Monaco, monospace">music</text>
  <text x="100" y="52" fill="#c9d1d9" font-size="12" font-family="Consolas, Monaco, monospace">= </text>
  <text x="118" y="52" fill="#a5d6ff" font-size="12" font-family="Consolas, Monaco, monospace">"Hip-Hop"</text>
  <text x="190" y="52" fill="#c9d1d9" font-size="12" font-family="Consolas, Monaco, monospace">;</text>

  <text x="16" y="72" fill="#7ee787" font-size="12" font-family="Consolas, Monaco, monospace">function</text>
  <text x="80" y="72" fill="#d2a8ff" font-size="12" font-family="Consolas, Monaco, monospace">dailyWork</text>
  <text x="160" y="72" fill="#c9d1d9" font-size="12" font-family="Consolas, monospace">() {</text>

  <text x="32" y="92" fill="#79c0ff" font-size="12" font-family="Consolas, Monaco, monospace">return</text>
  <text x="76" y="92" fill="#a5d6ff" font-size="12" font-family="Consolas, Monaco, monospace">"CRUD"</text>
  <text x="124" y="92" fill="#c9d1d9" font-size="12" font-family="Consolas, Monaco, monospace">;</text>

  <text x="16" y="112" fill="#c9d1d9" font-size="12" font-family="Consolas, Monaco, monospace">}</text>

  <text x="16" y="136" fill="#8b949e" font-size="12" font-family="Consolas, Monaco, monospace">// 音乐即生命 🎵</text>

  <!-- 闪烁光标 -->
  <rect x="16" y="150" width="9" height="14" rx="1" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
